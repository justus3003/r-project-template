name: R CMD check

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  check:
    name: R CMD check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-r-env

      - name: 🧪 Run R CMD check
        run: Rscript -e 'devtools::check(args = c("--no-manual"), error_on = "warning")'
